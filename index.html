<!doctype html><!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PYNDRYX — Master Feature Roadmap</title>
  <style>
    :root{
      --bg0:#060a10;
      --bg1:#07111e;
      --card:#0b1626cc;
      --card2:#0b162699;
      --border:#1f2a3a;
      --text:#e7eefc;
      --muted:#a8b6cf;
      --muted2:#7f91ad;
      --accent:#6dd6ff;
      --accent2:#ffd36a;
      --good:#26e6a5;
      --warn:#ffcc66;
      --shadow: 0 16px 40px rgba(0,0,0,.45);
      --radius: 16px;
      --radius2: 22px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: var(--sans);
      color:var(--text);
      background:
        radial-gradient(1000px 700px at 20% 10%, rgba(23,81,140,.35), transparent 60%),
        radial-gradient(900px 700px at 80% 30%, rgba(0,190,255,.12), transparent 60%),
        radial-gradient(800px 700px at 50% 90%, rgba(255,210,110,.10), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow-x:hidden;
    }
    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{
      width:min(1120px, calc(100% - 32px));
      margin: 40px auto 60px;
    }
    header{
      margin-bottom: 18px;
    }
    h1{
      font-size: clamp(26px, 4vw, 36px);
      margin:0 0 6px;
      letter-spacing:.2px;
    }
    .sub{
      color:var(--muted);
      font-size: 13px;
      margin: 0 0 6px;
    }
    .byline{
      color: var(--muted2);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .chipbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin: 16px 0 14px;
      padding: 10px 12px;
      border:1px solid var(--border);
      border-radius: var(--radius2);
      background: linear-gradient(180deg, rgba(10,22,38,.78), rgba(8,16,28,.55));
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }
    .chip{
      display:inline-flex;
      gap:8px;
      align-items:center;
      border:1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.035);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .chip b{color:var(--text); font-weight:650}
    .chip .dot{
      width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.18);
      display:inline-block;
    }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin: 14px 0 18px;
    }
    .search{
      flex: 1 1 420px;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 14px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.18);
    }
    .search input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-size: 13px;
    }
    .btn{
      border:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 9px 11px;
      border-radius: 12px;
      font-size: 12px;
      cursor:pointer;
      transition: transform .05s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.13)}
    .btn:active{transform: translateY(1px)}
    .btn.primary{
      border-color: rgba(109,214,255,.25);
      background: rgba(109,214,255,.08);
    }
    .btn.toggle-on{
      border-color: rgba(255,211,106,.30);
      background: rgba(255,211,106,.10);
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 10px;
    }
    .grid.two{
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 860px){
      .grid.two{grid-template-columns:1fr}
    }

    details.card{
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      background: linear-gradient(180deg, rgba(12,24,40,.78), rgba(7,14,25,.58));
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    summary{
      list-style:none;
      cursor:pointer;
      padding: 14px 16px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }
    summary::-webkit-details-marker{display:none}
    .cardhead{
      display:flex;
      gap: 10px;
      align-items:center;
      min-width: 0;
    }
    .title{
      font-weight: 750;
      letter-spacing:.2px;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .badge{
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      background: rgba(255
